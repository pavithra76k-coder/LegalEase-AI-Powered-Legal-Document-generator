<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalEase - Legal Document Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1e3a5f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #142840;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-left: 5px solid #1e3a5f;
            white-space: pre-line;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>LegalEase</h1>
    <p>AI-Powered Legal Document Generator</p>
</header>

<div class="container">

    <h2>Generate Legal Document</h2>

    <label>Document Type</label>
    <select id="documentType">
        <option value="Rental Agreement">Rental Agreement</option>
        <option value="Leave Letter">Leave Letter</option>
        <option value="Legal Notice">Legal Notice</option>
        <option value="Affidavit">Affidavit</option>
        <option value="Complaint Letter">Complaint Letter</option>
    </select>

    <label>Your Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Address</label>
    <input type="text" id="address" placeholder="Enter your address">

    <label>Additional Details</label>
    <textarea id="details"
        placeholder="Enter important details about the document"></textarea>

    <button onclick="generateDocument()">Generate Document</button>

    <div id="result"></div>

</div>

<script>
function generateDocument() {

    let type = document.getElementById("documentType").value;
    let name = document.getElementById("name").value;
    let address = document.getElementById("address").value;
    let details = document.getElementById("details").value;

    if (name === "" || address === "" || details === "") {
        alert("Please fill all the details.");
        return;
    }

    let documentText =
        "LEGAL DOCUMENT\n\n" +
        "Document Type: " + type + "\n\n" +
        "Name: " + name + "\n" +
        "Address: " + address + "\n\n" +
        "Details:\n" + details + "\n\n" +
        "This document has been generated using LegalEase.\n" +
        "Please verify the information before using it.";

    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerText = documentText;
}
</script>

</body>
</html>
